<html lang="ar" dir="rtl">

<meta name="theme-color" content="#0f766e">

<style>
:root{
  --brand:#0f766e;
  --dark:#0b5f59;
  --soft:#e9f7f5;
  --bg:#f3f7f8;
  --ink:#1e293b;
  --muted:#64748b;
  --line:#dbe5e8;
  --shadow:0 12px 30px rgba(15,118,110,.09);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at 100% 0,#eaf8f6 0,transparent 28%),var(--bg);
  color:var(--ink);
  min-height:100vh;
}

.header{
  background:linear-gradient(135deg,#0b7a70,#0f766e,#0b6a73);
  color:#fff;
  padding:22px 18px 28px;
  border-radius:0 0 32px 32px;
  box-shadow:0 12px 32px rgba(15,118,110,.17);
}

.brand{
  max-width:950px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  width:115px;
  height:80px;
  object-fit:contain;
  background:#fff;
  padding:8px;
  border-radius:17px;
}

.brand h1{
  margin:3px 0;
  font-size:24px;
}

.brand p{
  margin:4px 0;
  font-size:14px;
}

.demo-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.25);
  padding:6px 11px;
  border-radius:99px;
  font-size:12px;
}
